<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="admob:ad_unit_id" content="ca-app-pub-9189946284954938/9506686862">
  <title>Unlock Content</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }h1 {
  font-size: 2rem;
  margin-bottom: 20px;
}

.start-button {
  padding: 12px 24px;
  background: #1e88e5;
  border: none;
  border-radius: 8px;
  color: white;
  font-size: 1rem;
  cursor: pointer;
  transition: background 0.3s;
}

.start-button:hover {
  background: #1565c0;
}

.options {
  margin-top: 30px;
  display: none;
  flex-direction: column;
  gap: 20px;
  animation: fadeIn 1s ease-in-out;
}

.option {
  padding: 16px;
  border: 2px solid #333;
  border-radius: 10px;
  text-align: center;
  font-size: 1.1rem;
  background: #1e1e1e;
  color: #ffffff;
  cursor: pointer;
  transition: transform 0.3s, background 0.3s;
}

.option:hover {
  transform: scale(1.05);
  background: #2c2c2c;
}

@keyframes fadeIn {
  0% {
    opacity: 0;
    transform: translateY(10px);
  }
  100% {
    opacity: 1;
    transform: translateY(0);
  }
}

.progress-container {
  width: 100%;
  max-width: 300px;
  height: 10px;
  background: #333;
  border-radius: 5px;
  overflow: hidden;
  margin-top: 15px;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: #4caf50;
  transition: width 1s linear;
}

  </style>
</head><body>
  <h1>Unlock Access</h1>
  <button class="start-button" onclick="showOptions()">Start</button>
  <div class="options" id="unlockOptions">
    <div class="option" onclick="startTimer()">Watch 30 Seconds to Unlock</div>
    <div class="progress-container" id="progressContainer" style="display: none;">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <a class="option" href="https://youtube.com/@antozo_op?si=ffwuKxXaxcqvUQt5" target="_blank">Subscribe to Unlock</a>
  </div>  <script>
    function showOptions() {
      document.getElementById("unlockOptions").style.display = "flex";
    }

    function startTimer() {
      const progressContainer = document.getElementById("progressContainer");
      const progressBar = document.getElementById("progressBar");
      progressContainer.style.display = "block";
      let time = 0;
      const interval = setInterval(() => {
        time++;
        progressBar.style.width = (time / 30) * 100 + "%";
        if (time >= 30) {
          clearInterval(interval);
          window.open("https://youtube.com/@antozo_op?si=ffwuKxXaxcqvUQt5", "_blank");
        }
      }, 1000);
    }
  </script></body></html>
