<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscribe to Unlock Content</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fa;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }
        .container {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            padding: 30px;
            text-align: center;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }
        p {
            color: #7f8c8d;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #2c3e50;
        }
        input[type="email"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: 500;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #2980b9;
        }
        .btn:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        .success-message {
            display: none;
            color: #27ae60;
            font-weight: 500;
            margin-top: 20px;
        }
        .countdown {
            font-size: 14px;
            color: #7f8c8d;
            margin-top: 10px;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        .checkbox-group input {
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Subscribe to Unlock Content</h1>
        <p>Enter your email below to subscribe and get immediate access</p>
        
        <form id="subscribeForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="your@email.com">
            </div>
            
            <div class="checkbox-group">
                <input type="checkbox" id="agreeTerms" required>
                <label for="agreeTerms">I agree to the terms and conditions</label>
            </div>
            
            <button type="submit" class="btn" id="submitBtn">Subscribe & Unlock</button>
            <div class="countdown" id="countdown"></div>
        </form>
        
        <div class="success-message" id="successMessage">
            Subscription successful! Redirecting you to the content...
        </div>
    </div>

    <script>
        const form = document.getElementById('subscribeForm');
        const emailInput = document.getElementById('email');
        const submitBtn = document.getElementById('submitBtn');
        const successMessage = document.getElementById('successMessage');
        const countdown = document.getElementById('countdown');
        
        // The URL to redirect to after successful subscription
        const REDIRECT_URL = "https://www.youtube.com/@antozo_op"; // CHANGE THIS TO YOUR DESIRED URL
        
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Validate email
            if (!emailInput.value || !emailInput.checkValidity()) {
                alert('Please enter a valid email address');
                return;
            }
            
            // Disable the button to prevent multiple submissions
            submitBtn.disabled = true;
            submitBtn.textContent = 'Processing...';
            
            // Simulate form submission (replace with actual API call in production)
            setTimeout(() => {
                // Show success message
                form.style.display = 'none';
                successMessage.style.display = 'block';
                
                // Start countdown before redirect
                let seconds = 5;
                countdown.textContent = `Redirecting in ${seconds} seconds...`;
                
                const timer = setInterval(() => {
                    seconds--;
                    countdown.textContent = `Redirecting in ${seconds} seconds...`;
                    
                    if (seconds <= 0) {
                        clearInterval(timer);
                        window.location.href = REDIRECT_URL;
                    }
                }, 1000);
                
                // In a real implementation, you would:
                // 1. Send the email to your server
                // 2. Verify the subscription
                // 3. Then redirect to the protected content
                
            }, 1500); // Simulate network delay
        });
        
        // Admin function to change redirect URL
        if (window.location.href.includes('?admin')) {
            const newUrl = prompt('Enter new redirect URL:', REDIRECT_URL);
            if (newUrl) {
                // In a real implementation, you would save this to your database
                console.log('New redirect URL would be saved as:', newUrl);
                alert('Redirect URL updated (this demo doesn\'t persist changes)');
            }
        }
    </script>
</body>
</html>
