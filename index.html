<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GCash Unlock</title>

  <!-- AdMob-like Ads for Web -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"></script>
  <script>
    (adsbygoogle = window.adsbygoogle || []).push({
      google_ad_client: "ca-app-pub-9189946284954938",
      enable_page_level_ads: true
    });
  </script>

  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --text: #ffffff;
      --button1: #00c6ff;
      --button2: #ff4081;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card);
      padding: 30px 20px;
      border-radius: 15px;
      text-align: center;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }

    h1 {
      margin-bottom: 15px;
      font-size: 1.8rem;
    }

    p {
      margin-bottom: 25px;
      color: #ccc;
    }

    .button {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 15px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: white;
      font-weight: bold;
      transition: transform 0.3s, background-color 0.3s;
    }

    .button.watch {
      background: linear-gradient(90deg, #00c6ff, #0072ff);
      animation: pulse-blue 2s infinite;
    }

    .button.subscribe {
      background: linear-gradient(90deg, #ff5f6d, #ffc371);
      animation: pulse-pink 2s infinite;
    }

    .button:hover {
      transform: scale(1.03);
    }

    @keyframes pulse-blue {
      0% { box-shadow: 0 0 0 0 rgba(0, 198, 255, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(0, 198, 255, 0); }
      100% { box-shadow: 0 0 0 0 rgba(0, 198, 255, 0); }
    }

    @keyframes pulse-pink {
      0% { box-shadow: 0 0 0 0 rgba(255, 95, 109, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(255, 95, 109, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 95, 109, 0); }
    }

    .ad-banner {
      margin: 20px 0;
      padding: 10px;
      background-color: #2a2a2a;
      border-radius: 10px;
    }

    @media (max-width: 500px) {
      .container {
        padding: 20px 15px;
      }

      h1 {
        font-size: 1.5rem;
      }

      .button {
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Unlock GCash Reward</h1>
    <p>Choose one of the options below to continue:</p>

    <div class="ad-banner">
      <ins class="adsbygoogle"
           style="display:block"
           data-ad-client="ca-app-pub-9189946284954938"
           data-ad-slot="9506686862"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
      <script>
           (adsbygoogle = window.adsbygoogle || []).push({});
      </script>
    </div>

    <a href="https://www.youtube.com/watch?v=V88Y8feR_IA" target="_blank">
      <button class="button watch">Watch 30 Seconds to Unlock</button>
    </a>

    <a href="https://www.youtube.com/watch?v=V88Y8feR_IA" target="_blank">
      <button class="button subscribe">Subscribe to Unlock</button>
    </a>

    <div class="ad-banner">
      <ins class="adsbygoogle"
           style="display:block"
           data-ad-client="ca-app-pub-9189946284954938"
           data-ad-slot="9506686862"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
      <script>
           (adsbygoogle = window.adsbygoogle || []).push({});
      </script>
    </div>
  </div>
</body>
</html>
