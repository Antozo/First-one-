<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#121212"/>
  <title>Unlock Content</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #121212;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 20px;
    }

    h1 {
      font-size: 24px;
      text-align: center;
      margin-bottom: 20px;
    }

    .btn {
      padding: 12px 24px;
      margin: 10px;
      background: #1e88e5;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .btn:hover {
      transform: scale(1.05);
    }

    .progress-container {
      width: 100%;
      max-width: 300px;
      background: #333;
      border-radius: 20px;
      overflow: hidden;
      margin-top: 20px;
      display: none;
    }

    .progress-bar {
      height: 20px;
      width: 0%;
      background: #4caf50;
      transition: width 1s linear;
    }

    .options {
      display: none;
      flex-direction: column;
      gap: 15px;
      margin-top: 30px;
    }

    .option-btn {
      background-color: #673ab7;
      border: none;
      border-radius: 10px;
      padding: 15px;
      color: white;
      font-size: 16px;
      text-align: center;
      text-decoration: none;
      transition: transform 0.3s, background-color 0.3s;
    }

    .option-btn:hover {
      transform: scale(1.05);
      background-color: #7e57c2;
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .animated {
      animation: fadeIn 0.8s ease forwards;
    }
  </style>
  <!-- AdMob Configuration (for Android apps) -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-app-pub-9189946284954938~2011340226"
     crossorigin="anonymous"></script>
</head>
<body>
  <h1>Click the button below to unlock the content</h1>
  <button class="btn" id="startBtn">Start</button>

  <div class="progress-container" id="progressContainer">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="options" id="unlockOptions">
    <a class="option-btn animated" href="https://youtube.com/@antozo_op?si=ffwuKxXaxcqvUQt5" target="_blank">
      Watch 30 seconds to unlock
    </a>
    <a class="option-btn animated" href="https://youtube.com/@antozo_op?si=ffwuKxXaxcqvUQt5" target="_blank">
      Subscribe to unlock
    </a>
  </div>

  <!-- AdMob Banner (optional placement for mobile app) -->
  <ins class="adsbygoogle"
     style="display:block"
     data-ad-client="ca-app-pub-9189946284954938"
     data-ad-slot="9506686862"
     data-ad-format="auto"
     data-full-width-responsive="true"></ins>
  <script>
    (adsbygoogle = window.adsbygoogle || []).push({});
  </script>

  <script>
    const startBtn = document.getElementById('startBtn');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const unlockOptions = document.getElementById('unlockOptions');

    startBtn.addEventListener('click', () => {
      startBtn.style.display = 'none';
      progressContainer.style.display = 'block';

      let seconds = 0;
      const interval = setInterval(() => {
        seconds++;
        const percent = (seconds / 30) * 100;
        progressBar.style.width = percent + '%';

        if (seconds >= 30) {
          clearInterval(interval);
          progressContainer.style.display = 'none';
          unlockOptions.style.display = 'flex';
        }
      }, 1000);
    });
  </script>
</body>
</html>
