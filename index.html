<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Unlock Premium Content</title>

  <!-- Google Fonts & Font Awesome -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #f1f3f6;
      margin: 0;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 0 12px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #3b5bdb;
    }

    .progress-bar {
      height: 8px;
      background: #dee2e6;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .progress {
      width: 0%;
      height: 100%;
      background: linear-gradient(to right, #3b5bdb, #7048e8);
      transition: width 0.4s ease;
    }

    .task {
      background: #f8f9fa;
      border: 1px solid #dee2e6;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: 0.3s;
    }

    .task:hover {
      background: #e7f5ff;
    }

    .task input {
      margin-right: 15px;
    }

    .btn {
      width: 100%;
      padding: 15px;
      background: #3b5bdb;
      color: white;
      border: none;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .btn:disabled {
      background: #ced4da;
      cursor: not-allowed;
    }

    .access {
      display: none;
      margin-top: 30px;
      padding: 20px;
      background: #d3f9d8;
      border-left: 5px solid #37b24d;
      border-radius: 8px;
      text-align: center;
    }

    .access a {
      display: inline-block;
      margin-top: 10px;
      background: #2f9e44;
      color: white;
      padding: 10px 25px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: bold;
    }

    .ad-banner {
      text-align: center;
      background: #e9ecef;
      padding: 20px;
      border-radius: 8px;
      margin: 20px 0;
      font-size: 14px;
      color: #6c757d;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1><i class="fas fa-unlock-alt"></i> Unlock Premium Content</h1>

    <div class="progress-bar">
      <div class="progress" id="progress"></div>
    </div>

    <div class="task" onclick="selectTask(this)">
      <input type="checkbox" class="task-checkbox">
      Watch a 30-second video
    </div>

    <div class="task" onclick="selectTask(this)">
      <input type="checkbox" class="task-checkbox">
      Share this page on social media
    </div>

    <div class="task" onclick="selectTask(this)">
      <input type="checkbox" class="task-checkbox">
      Solve a simple CAPTCHA
    </div>

    <div class="ad-banner">
      <i class="fas fa-ad"></i> Ad Placeholder (e.g., GitHub Pages banner)
    </div>

    <button class="btn" id="unlockBtn" disabled onclick="showAccess()">Get Access</button>

    <div class="access" id="accessBox">
      <h2><i class="fas fa-check-circle"></i> Success!</h2>
      <p>You’ve unlocked the content.</p>
      <a href="/Complete-to-unlock.html" target="_blank">
        Go to Content <i class="fas fa-external-link-alt"></i>
      </a>
    </div>
  </div>

  <script>
    function selectTask(taskElement) {
      document.querySelectorAll('.task-checkbox').forEach(cb => cb.checked = false);
      taskElement.querySelector('input').checked = true;

      // Enable button and update progress
      document.getElementById('unlockBtn').disabled = false;
      document.getElementById('progress').style.width = '100%';
    }

    function showAccess() {
      document.getElementById('accessBox').style.display = 'block';
      document.getElementById('unlockBtn').disabled = true;
      document.getElementById('progress').style.width = '0%';
    }
  </script>
</body>
</html>
